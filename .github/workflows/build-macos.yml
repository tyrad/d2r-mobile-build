name: Build macOS
run-name: macOS source build · ${{ inputs.source_ref || 'v1.0.16' }}
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-macos.yml
  workflow_dispatch:
    inputs:
      prepared_input:
        description: macOS prepared package JSON
        type: string
        required: false
        default: '{"url":"https://ipfs.filebase.io/ipns/k51qzi5uqu5dkbfnqcjbd6jlgbckojtl4gu7m1kgu8esex1zg4oo485o5cjop2/D2RMobile-MacPrepared.zip","sha256_url":"https://ipfs.filebase.io/ipns/k51qzi5uqu5dkbfnqcjbd6jlgbckojtl4gu7m1kgu8esex1zg4oo485o5cjop2/MacPrepared-SHA256SUMS.txt"}'
      source_ref:
        description: Upstream release, branch or commit
        type: string
        default: v1.0.16
permissions:
  contents: write
  actions: write
jobs:
  build:
    uses: ./.github/workflows/pack-macos-checked.yml
    with:
      prepared_input: ${{ inputs.prepared_input || '{"url":"https://ipfs.filebase.io/ipns/k51qzi5uqu5dkbfnqcjbd6jlgbckojtl4gu7m1kgu8esex1zg4oo485o5cjop2/D2RMobile-MacPrepared.zip","sha256_url":"https://ipfs.filebase.io/ipns/k51qzi5uqu5dkbfnqcjbd6jlgbckojtl4gu7m1kgu8esex1zg4oo485o5cjop2/MacPrepared-SHA256SUMS.txt"}' }}
      source_repository: jhaizhou-ops/d2r-mobile
      source_ref: ${{ inputs.source_ref || 'v1.0.16' }}
